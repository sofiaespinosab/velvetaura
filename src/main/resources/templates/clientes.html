<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes - VelvetAura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="contenedor">
<div class="marca">💖 VelvetAura 💖</div>
<h1>Clientes</h1>
<nav class="menu">
    <a th:href="@{/productos}">🛍️ Productos</a>
    <a th:href="@{/clientes}">💌 Clientes</a>
    <a th:href="@{/eventos}">📖 Historial</a>
</nav>

<p class="ok" th:if="${mensaje}" th:text="${mensaje}"></p>


<fieldset>
    <legend>Registrar cliente</legend>
    <form th:action="@{/clientes}" th:object="${cliente}" method="post">
        <div>
            Identificación: <input type="text" th:field="*{identificacion}">
            <span class="error" th:errors="*{identificacion}"></span>
        </div>
        <div>
            Nombre: <input type="text" th:field="*{nombre}">
            <span class="error" th:errors="*{nombre}"></span>
        </div>
        <div>
            Correo: <input type="text" th:field="*{correo}">
            <span class="error" th:errors="*{correo}"></span>
        </div>
        <button type="submit">Guardar cliente</button>
    </form>
</fieldset>

<fieldset>
    <legend>Clientes registrados</legend>
    <table>
        <thead>
        <tr>
            <th>Identificación</th>
            <th>Nombre</th>
            <th>Correo</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.identificacion}"></td>
            <td th:text="${c.nombre}"></td>
            <td th:text="${c.correo}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(clientes)}">
            <td colspan="3">No hay clientes registrados.</td>
        </tr>
        </tbody>
    </table>
</fieldset>
</div>
</body>
</html>
