<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de eventos - VelvetAura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div class="contenedor">
<div class="marca">💖 VelvetAura 💖</div>
<h1>Historial de eventos</h1>
<nav class="menu">
    <a th:href="@{/productos}">🛍️ Productos</a>
    <a th:href="@{/clientes}">💌 Clientes</a>
    <a th:href="@{/eventos}">📖 Historial</a>
</nav>

<table>
    <thead>
    <tr>
        <th>Fecha</th>
        <th>Tipo</th>
        <th>Descripción</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="e : ${eventos}">
        <td th:text="${#temporals.format(e.fecha, 'dd/MM/yyyy HH:mm:ss')}"></td>
        <td th:text="${e.tipo}"></td>
        <td th:text="${e.descripcion}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(eventos)}">
        <td colspan="3">Todavía no hay eventos.</td>
    </tr>
    </tbody>
</table>
</div>
</body>
</html>
